[project]
name = "fan-bracket-cad"
version = "0.1.0"
description = "Parametric build123d model for 140mm fan mounting brackets"
requires-python = ">=3.10"
dependencies = [
    "build123d>=0.11",
    "ocp-vscode>=4.0.1",
]

[project.scripts]
fan-bracket-build = "fan_bracket_cad.bracket:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_utils", "src/fan_bracket_cad", "src/drive_bracket_cad"]
